<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#361d32" />
  <title>Steam Radar — Find creators for your game</title>
  <meta name="description" content="Discover YouTube creators already making videos about your Steam game." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300,0,0" rel="stylesheet" />
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@mui/material@5.16.7/umd/material-ui.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.2/babel.min.js"></script>
  <script src="config.js"></script>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; background: #361d32; overflow-x: hidden; }
    button, input { font: inherit; }
    .material-symbols-rounded { font-family: 'Material Symbols Rounded' !important; font-weight: normal; font-style: normal; line-height: 1; letter-spacing: normal; text-transform: none; white-space: nowrap; word-wrap: normal; direction: ltr; -webkit-font-feature-settings: 'liga'; font-feature-settings: 'liga'; -webkit-font-smoothing: antialiased; }
    ::selection { background: rgba(245, 89, 81, .35); }
    ::-webkit-scrollbar { width: 10px; }
    ::-webkit-scrollbar-track { background: #361d32; }
    ::-webkit-scrollbar-thumb { background: #6e5369; border: 3px solid #361d32; border-radius: 20px; }
    .orbital-stage { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
    .orbit { position: absolute; left: 50%; top: 54%; border: 1px solid rgba(237,210,203,.09); border-radius: 50%; transform: translate(-50%,-50%); }
    .orbit.one { width: 620px; height: 620px; }
    .orbit.two { width: 850px; height: 850px; }
    .orbit.three { width: 1080px; height: 1080px; }
    .orbit::after { content: ''; position: absolute; inset: 12%; border: 1px dashed rgba(237,210,203,.035); border-radius: inherit; }
    .platform-float { position: absolute; display: grid; place-items: center; width: 68px; height: 68px; border-radius: 50%; background: rgba(84,60,82,.72); border: 1px solid rgba(237,210,203,.14); box-shadow: 0 18px 45px rgba(12,4,11,.32); backdrop-filter: blur(12px); }
    .float-youtube { left: calc(50% - 420px); top: 25%; }
    .float-twitch { right: calc(50% - 425px); top: 31%; }
    .float-tiktok { left: calc(50% - 485px); bottom: 18%; }
    .float-x { right: calc(50% - 475px); bottom: 18%; }
    .platform-mark { width: 30px; height: 30px; display: block; }
    .platform-mark svg { width: 100%; height: 100%; display: block; }
    .hero-noise { position: absolute; inset: 0; opacity: .18; pointer-events: none; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.16'/%3E%3C/svg%3E"); }
    .thumbnail-img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .45s ease; }
    .video-card:hover .thumbnail-img { transform: scale(1.035); }
    .video-card { animation: card-in .45s both; }
    @keyframes card-in { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
    @media (max-width: 800px) {
      .orbit.one { width: 470px; height: 470px; }
      .orbit.two { width: 670px; height: 670px; }
      .orbit.three { width: 860px; height: 860px; }
      .platform-float { width: 54px; height: 54px; }
      .float-youtube { left: 5%; top: 24%; }
      .float-twitch { right: 4%; top: 31%; }
      .float-tiktok, .float-x { display: none; }
    }
    @media (max-width: 600px) { .platform-float { display: none; } }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { Alert, AppBar, Avatar, Box, Button, Card, CardContent, Chip, CircularProgress, Container, CssBaseline, Dialog, DialogActions, DialogContent, DialogTitle, Divider, Fab, FormControl, Icon, IconButton, InputAdornment, InputLabel, LinearProgress, Link, MenuItem, Select, Skeleton, Stack, TextField, ThemeProvider, Toolbar, Tooltip, Typography, createTheme } = MaterialUI;
    const COLORS={plum:'#361d32',mauve:'#543c52',coral:'#f55951',blush:'#edd2cb',cream:'#f1e8e6'};
    const theme=createTheme({palette:{mode:'dark',primary:{main:COLORS.coral,contrastText:'#2a1526'},secondary:{main:COLORS.blush},background:{default:COLORS.plum,paper:COLORS.mauve},text:{primary:COLORS.cream,secondary:'#cdbbc8'},divider:'rgba(237,210,203,.13)'},typography:{fontFamily:'DM Sans, sans-serif',h1:{fontFamily:'Manrope, sans-serif',fontWeight:500,letterSpacing:'-.045em'},h2:{fontFamily:'Manrope, sans-serif',fontWeight:600,letterSpacing:'-.035em'},button:{fontWeight:700,textTransform:'none'}},shape:{borderRadius:18},components:{MuiButton:{styleOverrides:{root:{borderRadius:999,paddingInline:20}}},MuiCard:{styleOverrides:{root:{backgroundImage:'none'}}},MuiChip:{styleOverrides:{root:{fontWeight:600}}},MuiDialog:{styleOverrides:{paper:{backgroundImage:'none',border:'1px solid rgba(237,210,203,.14)'}}}}});
    const HOSTED_API_URL=String(window.STEAM_RADAR_CONFIG?.apiUrl||'').replace(/\/$/,'');
    const SUPABASE_URL=String(window.STEAM_RADAR_CONFIG?.supabaseUrl||'').replace(/\/$/,'');
    const SUPABASE_KEY=String(window.STEAM_RADAR_CONFIG?.publishableKey||'');
    const authClient=SUPABASE_URL&&SUPABASE_KEY?supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}):null;
    const icon=(name,sx={})=><Icon className="material-symbols-rounded" sx={{fontSize:21,...sx}}>{name}</Icon>;

    function PlatformLogo({name}){
      if(name==='YouTube')return <span className="platform-mark"><svg viewBox="0 0 32 32"><rect x="2" y="7" width="28" height="18" rx="6" fill="#f55951"/><path d="M13 11.5 22 16l-9 4.5z" fill="#f1e8e6"/></svg></span>;
      if(name==='Twitch')return <span className="platform-mark"><svg viewBox="0 0 32 32"><path fill="#edd2cb" d="M5 3h24v17l-7 7h-6l-4 4v-4H5z"/><path fill="#543c52" d="M9 7v16h5v3l3-3h6l3-3V7zm8 11h-3v-7h3zm6 0h-3v-7h3z"/></svg></span>;
      if(name==='TikTok')return <span className="platform-mark"><svg viewBox="0 0 32 32"><path d="M19 4c.5 4 2.8 6.3 7 6.7v4.4a13 13 0 0 1-7-2.1v9a8 8 0 1 1-7-7.9v4.6a3.7 3.7 0 1 0 2.5 3.5V4z" fill="#f1e8e6"/></svg></span>;
      return <span className="platform-mark"><svg viewBox="0 0 32 32"><path d="M7 5h5.8l4.4 6.2L22.5 5H27l-7.8 9.3L28 27h-5.8l-5.9-8.3L9.4 27H5l9.2-11.2z" fill="#f1e8e6"/></svg></span>;
    }
    function Brand(){return <Stack direction="row" alignItems="center" spacing={1.25}><Box sx={{width:35,height:35,borderRadius:'50%',border:'1px solid rgba(237,210,203,.3)',display:'grid',placeItems:'center',position:'relative'}}><Box sx={{width:14,height:14,borderRadius:'50%',border:'2px solid',borderColor:'primary.main'}}/><Box sx={{position:'absolute',width:4,height:4,bgcolor:'secondary.main',borderRadius:'50%',right:5,top:6}}/></Box><Typography sx={{fontFamily:'Manrope',fontWeight:800,letterSpacing:'-.04em',fontSize:19}}>STEAM RADAR</Typography></Stack>}
    function Header({user,onSignOut}){return <AppBar position="absolute" elevation={0} color="transparent" sx={{zIndex:5}}><Toolbar sx={{minHeight:{xs:72,md:88},px:{xs:2,md:5}}}><Brand/><Stack direction="row" spacing={4} sx={{ml:'auto',mr:4,display:{xs:'none',md:'flex'}}}><Link href="#discover" underline="none" color="text.secondary" sx={{fontSize:14,'&:hover':{color:'text.primary'}}}>Discover</Link><Link href="#how-it-works" underline="none" color="text.secondary" sx={{fontSize:14,'&:hover':{color:'text.primary'}}}>How it works</Link></Stack><Tooltip title={user?.email||''}><Button onClick={onSignOut} color="secondary" variant="outlined" startIcon={icon('logout',{fontSize:17})} sx={{ml:{xs:'auto',md:0},minWidth:{xs:44,sm:'auto'},px:{xs:1.25,sm:2.5}}}><Box component="span" sx={{display:{xs:'none',sm:'inline'}}}>Sign out</Box></Button></Tooltip></Toolbar></AppBar>}

    function LoginPage(){const[email,setEmail]=React.useState(''),[loading,setLoading]=React.useState(false),[message,setMessage]=React.useState(''),[error,setError]=React.useState('');const submit=async e=>{e.preventDefault();setError('');setMessage('');if(!authClient){setError('Authentication is not configured.');return}setLoading(true);try{const redirectTo=`${location.origin}${location.pathname}`;const{error:signInError}=await authClient.auth.signInWithOtp({email:email.trim().toLowerCase(),options:{shouldCreateUser:false,emailRedirectTo:redirectTo}});if(signInError)throw signInError;setMessage('Check your inbox for a secure sign-in link.')}catch(err){setError(err.message||'Could not send the sign-in link.')}finally{setLoading(false)}};return <ThemeProvider theme={theme}><CssBaseline/><Box sx={{minHeight:'100vh',display:'grid',placeItems:'center',position:'relative',overflow:'hidden',px:2,background:'radial-gradient(circle at 50% 35%, #543c52 0%, #42263d 30%, #361d32 72%)'}}><div className="hero-noise"/><Box sx={{position:'absolute',top:{xs:24,md:36},left:{xs:24,md:48}}}><Brand/></Box><Card component="main" sx={{position:'relative',zIndex:1,width:'min(440px,100%)',p:{xs:3,sm:5},bgcolor:'rgba(84,60,82,.68)',border:'1px solid rgba(237,210,203,.16)',boxShadow:'0 28px 90px rgba(18,5,16,.46)',backdropFilter:'blur(24px)'}}><Avatar sx={{width:52,height:52,bgcolor:'rgba(245,89,81,.15)',color:'primary.main',mb:3}}>{icon('lock',{fontSize:27})}</Avatar><Typography variant="h2" sx={{fontSize:{xs:30,sm:36}}}>Team access</Typography><Typography color="text.secondary" sx={{mt:1.5,lineHeight:1.65}}>Enter your approved email. We’ll send you a secure sign-in link—there are no passwords or public sign-ups.</Typography><Box component="form" onSubmit={submit} sx={{mt:4}}><TextField autoFocus fullWidth required type="email" label="Work email" value={email} onChange={e=>setEmail(e.target.value)} autoComplete="email" InputProps={{startAdornment:<InputAdornment position="start">{icon('mail')}</InputAdornment>}}/><Button fullWidth type="submit" variant="contained" disabled={loading} sx={{mt:2.25,minHeight:48}} startIcon={loading?<CircularProgress size={18} color="inherit"/>:icon('arrow_forward')}>{loading?'Sending link…':'Continue with email'}</Button></Box>{(error||message)&&<Alert severity={error?'error':'success'} sx={{mt:2.5}}>{error||message}</Alert>}<Typography color="text.secondary" sx={{fontSize:11,mt:3,textAlign:'center'}}>Access is restricted to pre-approved Steam Radar users.</Typography></Card></Box></ThemeProvider>}

    function SearchBar({steamUrl,setSteamUrl,maxResults,setMaxResults,loading,onSearch}){return <Box component="form" onSubmit={e=>{e.preventDefault();onSearch()}} sx={{width:'min(760px, 100%)',p:'6px',pl:{xs:2,sm:2.5},display:'flex',alignItems:'center',gap:1,border:'1px solid rgba(237,210,203,.22)',borderRadius:'999px',bgcolor:'rgba(54,29,50,.72)',backdropFilter:'blur(20px)',boxShadow:'0 24px 80px rgba(18,5,16,.38)',position:'relative','&::before':{content:'""',position:'absolute',inset:-1,borderRadius:'inherit',padding:'1px',background:'linear-gradient(90deg,rgba(237,210,203,.28),rgba(245,89,81,.72),rgba(237,210,203,.2))',WebkitMask:'linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0)',WebkitMaskComposite:'xor',pointerEvents:'none'}}}>{icon('search',{color:'secondary.main',opacity:.8})}<TextField value={steamUrl} onChange={e=>setSteamUrl(e.target.value)} fullWidth placeholder="Enter a Steam game name" inputProps={{'aria-label':'Steam game name'}} sx={{'& fieldset':{border:0},'& .MuiInputBase-root':{p:0},'& input':{py:1.35,fontSize:{xs:14,sm:16}}}}/><FormControl size="small" sx={{minWidth:88,display:{xs:'none',sm:'block'},'& fieldset':{borderColor:'rgba(237,210,203,.14)'}}}><Select value={maxResults} onChange={e=>setMaxResults(e.target.value)} aria-label="Maximum results">{[50,100,200,300,500].map(n=><MenuItem key={n} value={n}>{n}</MenuItem>)}</Select></FormControl><IconButton type="submit" disabled={loading} aria-label="Search videos" sx={{bgcolor:'primary.main',color:'primary.contrastText',width:48,height:48,flex:'0 0 auto','&:hover':{bgcolor:'#ff6f66'},'&.Mui-disabled':{bgcolor:'rgba(245,89,81,.5)'}}}>{loading?<CircularProgress size={20} color="inherit"/>:icon('arrow_outward')}</IconButton></Box>}
    function SourceRow({platforms,setPlatforms}){const toggle=source=>{const key=source.toLowerCase();setPlatforms(current=>current.includes(key)?(current.length===1?current:current.filter(x=>x!==key)):[...current,key])};return <Stack direction="row" alignItems="center" justifyContent="center" spacing={{xs:1,sm:1.5}} sx={{mt:3}}>{['YouTube','Twitch','TikTok','X'].map(source=>{const key=source.toLowerCase(),available=key==='youtube'||key==='twitch',active=platforms.includes(key);return <Tooltip key={source} title={available?(active?`Remove ${source} from search`:`Add ${source} to search`):`${source} support coming soon`} arrow><Box component={available?'button':'div'} type={available?'button':undefined} onClick={available?()=>toggle(source):undefined} sx={{font:'inherit',color:'inherit',cursor:available?'pointer':'default',display:'flex',alignItems:'center',gap:1,px:{xs:1.15,sm:1.5},py:.8,borderRadius:99,border:'1px solid',borderColor:active?'rgba(245,89,81,.65)':'rgba(237,210,203,.1)',bgcolor:active?'rgba(245,89,81,.12)':'rgba(84,60,82,.22)',opacity:available?1:.45}}><Box sx={{width:22,height:22}}><PlatformLogo name={source}/></Box><Typography sx={{fontSize:12,fontWeight:700,display:{xs:available?'block':'none',sm:'block'}}}>{source}</Typography>{available&&active&&icon('check_circle',{fontSize:14,color:'primary.main'})}{!available&&<Typography sx={{fontSize:9,textTransform:'uppercase',letterSpacing:'.08em',opacity:.7,display:{xs:'none',md:'block'}}}>Soon</Typography>}</Box></Tooltip>})}</Stack>}
    function Hero({platforms,setPlatforms,...searchProps}){return <Box component="section" sx={{minHeight:{xs:720,md:790},position:'relative',display:'flex',alignItems:'center',overflow:'hidden',background:'radial-gradient(circle at 50% 44%, #543c52 0%, #42263d 28%, #361d32 68%)'}}><div className="hero-noise"/><div className="orbital-stage"><div className="orbit one"/><div className="orbit two"/><div className="orbit three"/><div className="platform-float float-youtube"><PlatformLogo name="YouTube"/></div><div className="platform-float float-twitch"><PlatformLogo name="Twitch"/></div><div className="platform-float float-tiktok"><PlatformLogo name="TikTok"/></div><div className="platform-float float-x"><PlatformLogo name="X"/></div></div><Container maxWidth="lg" sx={{position:'relative',zIndex:2,textAlign:'center',pt:10}}><Chip label="CREATOR DISCOVERY FOR GAME TEAMS" size="small" variant="outlined" sx={{mb:3,color:'secondary.main',borderColor:'rgba(237,210,203,.24)',letterSpacing:'.12em',fontSize:10,bgcolor:'rgba(54,29,50,.25)'}}/><Typography variant="h1" sx={{fontSize:{xs:'2.45rem',sm:'3.6rem',md:'4.65rem'},lineHeight:1.06,maxWidth:860,mx:'auto'}}>Find the creators already<br/><Box component="span" sx={{color:'secondary.main'}}>talking about your game.</Box></Typography><Typography color="text.secondary" sx={{mt:2.5,mb:4,mx:'auto',maxWidth:560,fontSize:{xs:15,md:17},lineHeight:1.7}}>Type a game name. Steam and SteamSpy resolve the exact title before we search YouTube and Twitch for relevant creators.</Typography><Stack alignItems="center"><SearchBar {...searchProps}/><SourceRow platforms={platforms} setPlatforms={setPlatforms}/></Stack><Stack direction="row" justifyContent="center" spacing={{xs:2,sm:4}} sx={{mt:5,color:'text.secondary'}}>{['Up to 500 per source','Public creator data','CSV export'].map((t,i)=><Stack key={t} direction="row" spacing={0.75} alignItems="center">{icon(i===0?'video_library':i===1?'verified_user':'download',{fontSize:16,color:'secondary.main'})}<Typography sx={{fontSize:{xs:11,sm:13}}}>{t}</Typography></Stack>)}</Stack></Container></Box>}

    const fmtN=n=>new Intl.NumberFormat('en',{notation:'compact',maximumFractionDigits:1}).format(Number(n)||0);
    const fmtDate=iso=>iso?new Date(iso).toLocaleDateString('en',{month:'short',day:'numeric',year:'numeric'}):'Unknown';
    const fmtDuration=sec=>{sec=Number(sec)||0;const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return h?`${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`:`${m}:${String(s).padStart(2,'0')}`};
    const escapeCsv=value=>`"${String(value??'').replaceAll('"','""')}"`;
    const download=(name,content,type='text/csv')=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type}));a.download=name;a.click();URL.revokeObjectURL(a.href)};
    function exportSelectedEmails(videos,selected,gameName){const recipients=new Map();videos.filter(v=>v.email&&selected.has(v.email.toLowerCase())).forEach(v=>{const key=v.email.toLowerCase();if(!recipients.has(key))recipients.set(key,[v.email,v.channel_name,v.platform||'youtube',v.channel_url,v.subscriber_count||'',v.country||'',v.title||'',v.video_url||''])});const rows=[...recipients.values()];if(!rows.length)return;download(`${(gameName||'steam-radar').replace(/\s+/g,'-').toLowerCase()}-selected-emails.csv`,[['email','channel','platform','channel_url','subscribers','country','content_title','content_url'],...rows].map(r=>r.map(escapeCsv).join(',')).join('\n'))}
    function FloatingEmailExport({count,onExport}){return <Fab variant="extended" color="primary" onClick={onExport} aria-label={`Export ${count} selected ${count===1?'email':'emails'}`} sx={{position:'fixed',right:{xs:16,sm:28},bottom:{xs:16,sm:28},zIndex:20,minHeight:54,px:2.5,boxShadow:'0 18px 55px rgba(18,5,16,.55)',border:'1px solid rgba(241,232,230,.22)',animation:'card-in .3s both','&:hover':{transform:'translateY(-2px)',boxShadow:'0 22px 65px rgba(18,5,16,.68)'}}}>{icon('download',{mr:1})}<Box component="span">Export {count} {count===1?'email':'emails'}</Box></Fab>}
    async function hostedSearch(payload,accessToken){if(!HOSTED_API_URL)throw new Error('The Supabase search endpoint is not configured in config.js.');const response=await fetch(HOSTED_API_URL,{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${accessToken}`,'apikey':SUPABASE_KEY},body:JSON.stringify(payload)});const data=await response.json().catch(()=>({}));if(response.status===401&&authClient)await authClient.auth.signOut();if(!response.ok)throw new Error(data.error||`Search API failed (${response.status}).`);return data}

    function Metric({iconName,value,label}){return <Stack direction="row" spacing={1} alignItems="center"><Box sx={{color:'secondary.main',display:'flex'}}>{icon(iconName,{fontSize:18})}</Box><Box><Typography sx={{fontSize:14,fontWeight:700,lineHeight:1.05}}>{value}</Typography><Typography color="text.secondary" sx={{fontSize:10,mt:.3}}>{label}</Typography></Box></Stack>}
    function VideoCard({video,selected,onToggle,onRemove,index}){return <Card className="video-card" sx={{border:'1px solid rgba(237,210,203,.12)',bgcolor:'rgba(84,60,82,.55)',borderRadius:3,overflow:'hidden',animationDelay:`${Math.min(index,12)*35}ms`,transition:'transform .25s,border-color .25s,box-shadow .25s','&:hover':{transform:'translateY(-4px)',borderColor:'rgba(245,89,81,.35)',boxShadow:'0 22px 60px rgba(16,5,14,.26)'}}}><Box sx={{position:'relative',aspectRatio:'16/9',overflow:'hidden',bgcolor:'#261421'}}><a href={video.video_url} target="_blank" rel="noopener noreferrer"><img className="thumbnail-img" src={video.thumbnail} alt="" loading="lazy"/></a><Chip label={fmtDuration(video.duration_seconds)} size="small" sx={{position:'absolute',right:10,bottom:10,bgcolor:'rgba(20,8,18,.84)',fontSize:11,height:24}}/><IconButton onClick={()=>onRemove(video.video_id)} aria-label="Remove video" size="small" sx={{position:'absolute',right:10,top:10,bgcolor:'rgba(20,8,18,.76)','&:hover':{bgcolor:'primary.main'}}}>{icon('close',{fontSize:17})}</IconButton></Box><CardContent sx={{p:2.25,'&:last-child':{pb:2.25}}}><Typography title={video.title} sx={{fontFamily:'Manrope',fontWeight:700,fontSize:16,lineHeight:1.35,minHeight:43,display:'-webkit-box',WebkitLineClamp:2,WebkitBoxOrient:'vertical',overflow:'hidden'}}>{video.title}</Typography><Stack direction="row" alignItems="center" spacing={1} sx={{mt:1.5}}><Avatar sx={{width:28,height:28,bgcolor:'rgba(245,89,81,.17)',color:'primary.main',fontSize:12,fontWeight:800}}>{(video.channel_name||'?')[0]}</Avatar><Box sx={{minWidth:0,flex:1}}><Typography noWrap sx={{fontSize:13,fontWeight:700}}>{video.channel_name}</Typography><Typography color="text.secondary" sx={{fontSize:10}}>{fmtDate(video.published_at)}</Typography></Box>{video.is_short&&<Chip label="Short" size="small" color="primary" variant="outlined" sx={{height:22,fontSize:10}}/>}</Stack><Divider sx={{my:2}}/><Stack direction="row" justifyContent="space-between"><Metric iconName="visibility" value={fmtN(video.view_count)} label="views"/><Metric iconName="thumb_up" value={fmtN(video.like_count)} label="likes"/><Metric iconName="forum" value={fmtN(video.comment_count)} label="comments"/></Stack><Stack direction="row" spacing={1} sx={{mt:2}}>{video.email?<Button onClick={()=>onToggle(video.email)} size="small" variant={selected?'contained':'outlined'} color={selected?'primary':'secondary'} startIcon={icon(selected?'check':'mail',{fontSize:16})} sx={{flex:1,overflow:'hidden',fontSize:11}}>{selected?'Selected':'Select email'}</Button>:<Button disabled size="small" variant="outlined" startIcon={icon('mail_off',{fontSize:16})} sx={{flex:1,fontSize:11}}>No public email</Button>}<IconButton component="a" href={video.video_url} target="_blank" rel="noopener noreferrer" aria-label="Watch video" sx={{border:'1px solid rgba(237,210,203,.2)',borderRadius:99}}>{icon('play_arrow')}</IconButton></Stack></CardContent></Card>}
    function UnifiedVideoCard({video,selected,onToggle,onRemove,index}){const twitch=video.platform==='twitch',primary=video.is_live?video.viewer_count:video.view_count;return <Card className="video-card" sx={{border:'1px solid rgba(237,210,203,.12)',bgcolor:'rgba(84,60,82,.55)',borderRadius:3,overflow:'hidden',animationDelay:`${Math.min(index,12)*35}ms`,transition:'transform .25s,border-color .25s,box-shadow .25s','&:hover':{transform:'translateY(-4px)',borderColor:'rgba(245,89,81,.35)',boxShadow:'0 22px 60px rgba(16,5,14,.26)'}}}><Box sx={{position:'relative',aspectRatio:'16/9',overflow:'hidden',bgcolor:'#261421'}}><a href={video.video_url} target="_blank" rel="noopener noreferrer"><img className="thumbnail-img" src={video.thumbnail} alt="" loading="lazy"/></a><Chip label={twitch?'Twitch':'YouTube'} size="small" sx={{position:'absolute',left:10,top:10,bgcolor:twitch?'#9146ff':'#f55951',color:'#fff',fontSize:10,height:24}}/>{video.is_live&&<Chip label="LIVE" size="small" sx={{position:'absolute',left:10,bottom:10,bgcolor:'#e91916',color:'#fff',fontSize:10,height:24}}/>}{video.duration_seconds>0&&<Chip label={fmtDuration(video.duration_seconds)} size="small" sx={{position:'absolute',right:10,bottom:10,bgcolor:'rgba(20,8,18,.84)',fontSize:11,height:24}}/>}<IconButton onClick={()=>onRemove(video.video_id)} aria-label="Remove result" size="small" sx={{position:'absolute',right:10,top:10,bgcolor:'rgba(20,8,18,.76)','&:hover':{bgcolor:'primary.main'}}}>{icon('close',{fontSize:17})}</IconButton></Box><CardContent sx={{p:2.25,'&:last-child':{pb:2.25}}}><Typography title={video.title} sx={{fontFamily:'Manrope',fontWeight:700,fontSize:16,lineHeight:1.35,minHeight:43,display:'-webkit-box',WebkitLineClamp:2,WebkitBoxOrient:'vertical',overflow:'hidden'}}>{video.title}</Typography><Stack direction="row" alignItems="center" spacing={1} sx={{mt:1.5}}><Avatar sx={{width:28,height:28,bgcolor:twitch?'rgba(145,70,255,.18)':'rgba(245,89,81,.17)',color:twitch?'#c9a9ff':'primary.main',fontSize:12,fontWeight:800}}>{(video.channel_name||'?')[0]}</Avatar><Box sx={{minWidth:0,flex:1}}><Typography noWrap sx={{fontSize:13,fontWeight:700}}>{video.channel_name}</Typography><Typography color="text.secondary" sx={{fontSize:10}}>{video.is_live?'Live now':fmtDate(video.published_at)}</Typography></Box>{video.is_short&&<Chip label="Short" size="small" color="primary" variant="outlined" sx={{height:22,fontSize:10}}/>}</Stack><Divider sx={{my:2}}/><Stack direction="row" justifyContent="space-between"><Metric iconName={video.is_live?'sensors':'visibility'} value={fmtN(primary)} label={video.is_live?'watching':'views'}/>{twitch?<><Metric iconName="schedule" value={fmtDuration(video.duration_seconds)} label="duration"/><Metric iconName="language" value={(video.language||'—').toUpperCase()} label="language"/></>:<><Metric iconName="thumb_up" value={fmtN(video.like_count)} label="likes"/><Metric iconName="forum" value={fmtN(video.comment_count)} label="comments"/></>}</Stack><Stack direction="row" spacing={1} sx={{mt:2}}>{video.email?<Button onClick={()=>onToggle(video.email)} size="small" variant={selected?'contained':'outlined'} color={selected?'primary':'secondary'} startIcon={icon(selected?'check':'mail',{fontSize:16})} sx={{flex:1,fontSize:11}}>{selected?'Selected':'Select email'}</Button>:<Button disabled size="small" variant="outlined" startIcon={icon('mail_off',{fontSize:16})} sx={{flex:1,fontSize:11}}>No public email</Button>}<IconButton component="a" href={video.video_url} target="_blank" rel="noopener noreferrer" aria-label={twitch?'Open Twitch':'Watch video'} sx={{border:'1px solid rgba(237,210,203,.2)',borderRadius:99}}>{icon(video.is_live?'sensors':'play_arrow')}</IconButton></Stack></CardContent></Card>}
    VideoCard=UnifiedVideoCard;
    function StatCard({label,value,iconName}){return <Card sx={{p:2.25,border:'1px solid rgba(237,210,203,.1)',bgcolor:'rgba(84,60,82,.38)'}}><Stack direction="row" alignItems="center" justifyContent="space-between"><Box><Typography color="text.secondary" sx={{fontSize:11,textTransform:'uppercase',letterSpacing:'.09em'}}>{label}</Typography><Typography sx={{fontFamily:'Manrope',fontWeight:700,fontSize:25,mt:.4}}>{value}</Typography></Box><Avatar sx={{bgcolor:'rgba(245,89,81,.12)',color:'primary.main'}}>{icon(iconName)}</Avatar></Stack></Card>}

    function Results({videos,gameName,removed,setRemoved,selected,setSelected}){const[emailFilter,setEmailFilter]=React.useState('all'),[typeFilter,setTypeFilter]=React.useState('all'),[sort,setSort]=React.useState('views'),[query,setQuery]=React.useState('');const visible=React.useMemo(()=>videos.filter(v=>!removed.has(v.video_id)).filter(v=>emailFilter==='email'?v.email:emailFilter==='none'?!v.email:true).filter(v=>typeFilter==='short'?v.is_short:typeFilter==='long'?!v.is_short:true).filter(v=>(v.title+' '+v.channel_name).toLowerCase().includes(query.toLowerCase())).sort((a,b)=>sort==='newest'?new Date(b.published_at)-new Date(a.published_at):sort==='ratio'?b.like_ratio-a.like_ratio:b.view_count-a.view_count),[videos,removed,emailFilter,typeFilter,sort,query]);const totalViews=visible.reduce((s,v)=>s+v.view_count,0),emails=visible.filter(v=>v.email).length,avgRatio=visible.length?visible.reduce((s,v)=>s+v.like_ratio,0)/visible.length:0;const toggle=email=>setSelected(prev=>{const n=new Set(prev),key=email.toLowerCase();n.has(key)?n.delete(key):n.add(key);return n});const remove=id=>setRemoved(prev=>new Set(prev).add(id));const exportCsv=()=>{const rows=visible.map(v=>[v.title,v.video_url,v.channel_name,v.channel_url,v.email||'',v.view_count,v.like_count,v.comment_count,v.published_at]);download(`${gameName.replace(/\s+/g,'-').toLowerCase()}-creators.csv`,[['title','video_url','channel','channel_url','email','views','likes','comments','published_at'],...rows].map(r=>r.map(escapeCsv).join(',')).join('\n'))};const exportSelected=()=>{const rows=videos.filter(v=>v.email&&selected.has(v.email.toLowerCase())).map(v=>[v.email,v.channel_name,v.channel_url,v.subscriber_count||'',v.country||'']);download(`${gameName.replace(/\s+/g,'-').toLowerCase()}-selected-emails.csv`,[['email','channel','channel_url','subscribers','country'],...rows].map(r=>r.map(escapeCsv).join(',')).join('\n'))};return <Box component="section" id="discover" sx={{py:{xs:7,md:10},background:'linear-gradient(180deg,#361d32 0%,#2d1829 100%)'}}><Container maxWidth="xl"><Stack direction={{xs:'column',md:'row'}} justifyContent="space-between" alignItems={{xs:'flex-start',md:'flex-end'}} spacing={2}><Box><Typography color="primary.main" sx={{fontSize:11,fontWeight:800,letterSpacing:'.14em',textTransform:'uppercase'}}>Discovery report</Typography><Typography variant="h2" sx={{fontSize:{xs:31,md:42},mt:.8}}>{gameName}</Typography><Typography color="text.secondary" sx={{mt:1}}>{visible.length} relevant creator videos ready to review.</Typography></Box><Stack direction="row" spacing={1} flexWrap="wrap" useFlexGap><Button variant="outlined" color="secondary" onClick={exportCsv} startIcon={icon('download')}>Export report</Button><Button variant="contained" onClick={exportSelected} disabled={!selected.size} startIcon={icon('alternate_email')}>Export {selected.size} emails</Button></Stack></Stack><Box sx={{display:'grid',gridTemplateColumns:{xs:'1fr 1fr',md:'repeat(4,1fr)'},gap:1.5,mt:4}}><StatCard label="Videos found" value={fmtN(visible.length)} iconName="video_library"/><StatCard label="Total views" value={fmtN(totalViews)} iconName="visibility"/><StatCard label="Avg. like rate" value={`${avgRatio.toFixed(2)}%`} iconName="favorite"/><StatCard label="Public emails" value={fmtN(emails)} iconName="alternate_email"/></Box><Card sx={{mt:3,p:1.5,border:'1px solid rgba(237,210,203,.1)',bgcolor:'rgba(84,60,82,.25)'}}><Stack direction={{xs:'column',md:'row'}} spacing={1.25} alignItems={{md:'center'}}><TextField size="small" value={query} onChange={e=>setQuery(e.target.value)} placeholder="Filter videos or channels" sx={{minWidth:{md:260}}} InputProps={{startAdornment:<InputAdornment position="start">{icon('search')}</InputAdornment>}}/><Stack direction="row" spacing={1} flexWrap="wrap" useFlexGap sx={{flex:1}}>{[['all','All videos'],['email','Has email'],['none','No email']].map(([v,l])=><Chip key={v} label={l} clickable onClick={()=>setEmailFilter(v)} color={emailFilter===v?'primary':'default'} variant={emailFilter===v?'filled':'outlined'}/>)}{[['short','Shorts'],['long','Long-form']].map(([v,l])=><Chip key={v} label={l} clickable onClick={()=>setTypeFilter(typeFilter===v?'all':v)} color={typeFilter===v?'primary':'default'} variant={typeFilter===v?'filled':'outlined'}/>)}</Stack><FormControl size="small" sx={{minWidth:150}}><InputLabel>Sort by</InputLabel><Select value={sort} label="Sort by" onChange={e=>setSort(e.target.value)}><MenuItem value="views">Most viewed</MenuItem><MenuItem value="newest">Newest</MenuItem><MenuItem value="ratio">Best like rate</MenuItem></Select></FormControl>{!!removed.size&&<Button onClick={()=>setRemoved(new Set())} color="secondary" startIcon={icon('undo')}>Restore {removed.size}</Button>}</Stack></Card>{visible.length?<Box sx={{display:'grid',gridTemplateColumns:{xs:'1fr',sm:'repeat(2,1fr)',lg:'repeat(3,1fr)',xl:'repeat(4,1fr)'},gap:2,mt:3}}>{visible.map((v,i)=><VideoCard key={v.video_id} video={v} index={i} selected={v.email?selected.has(v.email.toLowerCase()):false} onToggle={toggle} onRemove={remove}/>)}</Box>:<Card sx={{mt:3,py:9,textAlign:'center',border:'1px dashed rgba(237,210,203,.2)',bgcolor:'rgba(84,60,82,.2)'}}>{icon('search_off',{fontSize:42,color:'secondary.main'})}<Typography variant="h6" sx={{mt:1}}>No matching videos</Typography><Typography color="text.secondary">Try clearing a filter or restoring removed cards.</Typography></Card>}</Container></Box>}

    function EmptyPreview(){return <Box component="section" id="discover" sx={{py:{xs:7,md:10},background:'linear-gradient(180deg,#361d32,#2d1829)'}}><Container maxWidth="lg"><Stack alignItems="center" textAlign="center"><Typography color="primary.main" sx={{fontSize:11,fontWeight:800,letterSpacing:'.14em'}}>ONE SEARCH. A CLEARER SIGNAL.</Typography><Typography variant="h2" sx={{fontSize:{xs:30,md:42},mt:1.2}}>A repeatable view of every creator.</Typography><Typography color="text.secondary" sx={{maxWidth:560,mt:1.5,lineHeight:1.7}}>Each result uses the same component, so video reach, engagement, channel identity, and contact availability are easy to scan and compare.</Typography></Stack><Box sx={{display:'grid',gridTemplateColumns:{xs:'1fr',md:'repeat(3,1fr)'},gap:2,mt:5}}>{[0,1,2].map(i=><Card key={i} sx={{overflow:'hidden',bgcolor:'rgba(84,60,82,.34)',border:'1px solid rgba(237,210,203,.08)'}}><Skeleton variant="rectangular" height={190} animation="wave"/><Box sx={{p:2.25}}><Skeleton width="85%"/><Skeleton width="65%"/><Stack direction="row" spacing={1} sx={{mt:2}}><Skeleton variant="circular" width={30} height={30}/><Skeleton width="45%"/></Stack><Divider sx={{my:2}}/><Stack direction="row" justifyContent="space-between"><Skeleton width="22%"/><Skeleton width="22%"/><Skeleton width="22%"/></Stack></Box></Card>)}</Box></Container></Box>}
    function Footer(){return <Box component="footer" id="how-it-works" sx={{py:4,bgcolor:'#271522',borderTop:'1px solid rgba(237,210,203,.08)'}}><Container maxWidth="xl"><Stack direction={{xs:'column',sm:'row'}} alignItems={{xs:'flex-start',sm:'center'}} justifyContent="space-between" spacing={2}><Brand/><Typography color="text.secondary" sx={{fontSize:12}}>Public data only · Built for responsible creator research</Typography><Typography color="text.secondary" sx={{fontSize:12}}>© {new Date().getFullYear()} Steam Radar</Typography></Stack></Container></Box>}
    function App({session}){const[gameQuery,setGameQuery]=React.useState(''),[maxResults,setMaxResults]=React.useState(100),[platforms,setPlatforms]=React.useState(['youtube','twitch']),[loading,setLoading]=React.useState(false),[error,setError]=React.useState(''),[warning,setWarning]=React.useState(''),[videos,setVideos]=React.useState([]),[gameName,setGameName]=React.useState(''),[removed,setRemoved]=React.useState(new Set()),[selected,setSelected]=React.useState(new Set());const runSearch=async()=>{setError('');setWarning('');const query=gameQuery.trim();if(query.length<2){setError('Enter at least two characters of the Steam game name.');return}setLoading(true);setRemoved(new Set());setSelected(new Set());try{const payload={game_name:query,platforms,max_results:Number(maxResults),date_filter:'all',language:'en'};let data;if(HOSTED_API_URL){const{data:{session:freshSession}}=await authClient.auth.getSession();if(!freshSession)throw new Error('Your session expired. Sign in again.');data=await hostedSearch(payload,freshSession.access_token)}else{if(platforms.includes('twitch'))throw new Error('Configure the Supabase search URL in config.js to enable Twitch.');const response=await fetch('/api/scrape',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});data=await response.json();if(!response.ok)throw new Error(data.error||'Search failed.')}const normalized=(data.videos||[]).map(v=>({platform:'youtube',content_type:'video',is_live:false,viewer_count:0,language:'',...v,view_count:v.is_live?(v.viewer_count||0):(v.view_count||0)}));setVideos(normalized);setGameName(data.game_name||query);const providerErrors=Object.entries(data.provider_errors||{});if(providerErrors.length)setWarning(providerErrors.map(([provider,message])=>`${provider}: ${message}`).join(' · '));setTimeout(()=>document.querySelector('#discover')?.scrollIntoView({behavior:'smooth'}),80)}catch(e){setError(e.message||'Search failed. Check the game name and try again.')}finally{setLoading(false)}};return <ThemeProvider theme={theme}><CssBaseline/><Header user={session.user} onSignOut={()=>authClient.auth.signOut()}/><Hero steamUrl={gameQuery} setSteamUrl={setGameQuery} maxResults={maxResults} setMaxResults={setMaxResults} platforms={platforms} setPlatforms={setPlatforms} loading={loading} onSearch={runSearch}/>{loading&&<LinearProgress color="primary" sx={{height:3}}/>}{(error||warning)&&<Container maxWidth="md" sx={{mt:-3,position:'relative',zIndex:4}}><Alert severity={error?'error':'warning'} onClose={()=>{setError('');setWarning('')}} sx={{boxShadow:'0 12px 40px rgba(0,0,0,.25)'}}>{error||warning}</Alert></Container>}{videos.length?<Results videos={videos} gameName={gameName} removed={removed} setRemoved={setRemoved} selected={selected} setSelected={setSelected}/>:<EmptyPreview/>}{selected.size>0&&<FloatingEmailExport count={selected.size} onExport={()=>exportSelectedEmails(videos,selected,gameName)}/>}<Footer/></ThemeProvider>}
    function Root(){const[session,setSession]=React.useState(undefined);React.useEffect(()=>{if(!authClient){setSession(null);return}authClient.auth.getSession().then(({data})=>setSession(data.session));const{data:{subscription}}=authClient.auth.onAuthStateChange((_event,nextSession)=>setSession(nextSession));return()=>subscription.unsubscribe()},[]);if(session===undefined)return <ThemeProvider theme={theme}><CssBaseline/><Box sx={{minHeight:'100vh',display:'grid',placeItems:'center',bgcolor:'background.default'}}><CircularProgress/></Box></ThemeProvider>;return session?<App session={session}/>:<LoginPage/>}
    ReactDOM.createRoot(document.getElementById('root')).render(<Root/>);
  </script>
